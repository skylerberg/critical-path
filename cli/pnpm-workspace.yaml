# cli/ resolves against its own lockfile and node_modules, so it needs its own copy of
# the settings pnpm 11 will only read from this file. See api/pnpm-workspace.yaml for
# the rest.
allowBuilds:
  esbuild: true

overrides:
  # Moved here from cli/package.json's `overrides`, which pnpm does not read. Keeping
  # it here rather than in the api package is the point of the separate lockfile: the
  # pin stays scoped to the CLI's tree.
  js-yaml: 4.3.0
  # openapi-typescript declares a `^5.x` peer on typescript and this package is on 6.
  # npm's hoisting made that silently work; pnpm reports it on every install unless the
  # version is stated. The api package has no such entry because nothing there depends on
  # openapi-typescript.
  #
  # Spelled out rather than pulled from a catalog, which is what web/ does for the
  # identical override. The constraint is real but it binds one line lower than an
  # earlier note here claimed. Measured both ways:
  #
  #   this line 'catalog:', with a catalog block added here  → pnpm run knip passes
  #   cli/package.json's typescript as "catalog:"            → Unresolved catalog references (1)
  #
  # api/knip.json lists ../cli as one of its workspaces and resolves that package's
  # dependency versions against the workspace file beside itself, which is api's and
  # has no catalog. So a catalog here would work and buy nothing: the devDependency
  # below it would still have to name a literal version, leaving the same two sites to
  # keep in step that the catalog was meant to collapse. web/ can collapse them because
  # no knip reads web/. Keep this in step with cli/package.json's typescript devDependency.
  openapi-typescript>typescript: 6.0.3

# Off. api/pnpm-workspace.yaml carries the two measurements behind that; both
# produce a hard failure with nothing actually wrong, and both survive the
# `pnpm install` the error tells you to run.
verifyDepsBeforeRun: false
