# pnpm 11 reads settings from nowhere else: .npmrc carries auth and registry only, and
# the package.json "pnpm" field is no longer read at all — neither is npm's top-level
# `overrides`, which is why the block below moved here rather than staying put. Keys are
# camelCase; a kebab-case key is ignored silently, with no warning and exit 0.
#
# No `packages:` key, so this file makes web/ the only member. api/, cli/ and
# preview-edge/ are siblings with their own copies; this is a monorepo and deliberately
# not a pnpm workspace. Never create one at the monorepo root — see api/pnpm-workspace.yaml.

# One entry, and it has to be spelled out: strictDepBuilds refuses to install while any
# dependency's install scripts are unruled, and `es*` buys nothing because a glob is
# not rejected — it just matches nothing.
allowBuilds:
  unrs-resolver: true # eslint-plugin-import-x's resolver; prebuilt binary

# One version of TypeScript, named once. openapi-typescript declares a `^5.x` peer and
# this package is on 6, so without the override pnpm reports an unmet peer on every
# install. npm expressed the same thing as `"typescript": "$typescript"`; pnpm 11 still
# accepts `$name` but deprecates it, and a catalog is the replacement.
catalog:
  typescript: 6.0.3

overrides:
  openapi-typescript>typescript: 'catalog:'

# Off. The idea — fail loudly when node_modules is stale rather than install behind
# your back — does not survive this repo, and the failure it produces is a hard error
# with nothing actually wrong. Under `CI` pnpm computes a different
# `enableGlobalVirtualStore` default than an install without it recorded, so every
# CI-flagged child dies:
#
#   $ pnpm exec node -e 'console.log(1)'        → 1
#   $ CI=1 pnpm exec node -e 'console.log(1)'   → ERR_PNPM_VERIFY_DEPS_BEFORE_RUN
#
# check-test-guards.mjs spawns all 33 children with CI=1, which took the guard suite
# from 33 caught bugs to 33 RUN-FAILED — a runner that can no longer tell a guard that
# bites from one that does not. `pnpm install` does not clear it. The api package has a
# second, unrelated trigger; api/pnpm-workspace.yaml records that one.
verifyDepsBeforeRun: false

# Supply-chain gate, matching `min-release-age=7` in ~/.npmrc and the global pnpm
# config: a version published in the last seven days is not installed, which is the
# window in which a compromised release is normally caught and pulled. npm counts
# that setting in DAYS and pnpm counts MINUTES, so seven days is 10080, not 7.
# Stated in every package because CI never reads a developer's global config, and
# pnpm 11's own default is only 1440 -- one day.
#
# `minimumReleaseAgeStrict` is already true by default once the age is set: when no
# version in range has aged past the gate, resolution fails rather than quietly
# falling back to one that has not.
minimumReleaseAge: 10080
