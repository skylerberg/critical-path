name: web-production-deploy
run-name: Web Production Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/web-deploy.yaml'
# A literal group, not '${{ github.workflow }}': that expression expands to the
# `name:` above, which the api deploy used to share — and cancel-in-progress
# here would then cancel an api deploy mid-migration. The two deploys are
# deliberately independent.
concurrency:
  group: 'web-production-deploy'
  cancel-in-progress: true
jobs:
  deploy-to-production:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    defaults:
      run:
        working-directory: web
    env:
      BUCKET: critical-path-web-prod

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # No root package.json: the action reads `packageManager` from the
          # package it is setting pnpm up for. Left to its default it looks at
          # the repository root and fails with "No pnpm version is specified".
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - id: 'auth'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/1085332810847/locations/global/workloadIdentityPools/default-pool/providers/github-provider'
          service_account: 'github-actions-service@realm-construction.iam.gserviceaccount.com'

      - uses: 'google-github-actions/setup-gcloud@v3'

      # An action input, so the job's working-directory does not apply: the
      # path is relative to the workspace root.
      - name: 'Upload site'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          path: 'web/dist'
          destination: '${{ env.BUCKET }}'
          parent: false
          process_gcloudignore: false

      # `gcloud storage` rather than `gsutil`: gsutil cannot consume the
      # workload-identity-federation credentials set up by auth@v3.
      - name: 'Set cache headers'
        run: |
          gcloud storage objects update --recursive \
            --cache-control='public, max-age=31536000, immutable' \
            "gs://$BUCKET/assets"
          gcloud storage objects update \
            --cache-control='public, max-age=31536000, immutable' \
            "gs://$BUCKET/workbox-*.js"
          gcloud storage objects update \
            --cache-control='no-cache, no-store, must-revalidate' \
            "gs://$BUCKET/index.html" "gs://$BUCKET/sw.js"
          gcloud storage objects update \
            --cache-control='no-cache, no-store, must-revalidate' \
            --content-type='application/manifest+json' \
            "gs://$BUCKET/manifest.webmanifest"
