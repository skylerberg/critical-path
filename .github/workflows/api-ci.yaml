name: API CI

# Scoped to the packages this workflow actually checks. The api suite runs
# cli/tests/** too, and the images job builds the preview-edge image, so a
# change to either of those packages has to land here as well.
#
# One file from a fourth package rides along: `web/src/lib/tiptap.ts`. Nothing
# here builds web, but tests/unit/documentEmptiness.test.ts reads that file and
# runs its emptiness rule against the same corpus as the api's, because the two
# cannot import each other and a shared runtime module is not available across
# packages. Without this entry a web-only edit to it would not run the suite
# holding the two together, and the drift would surface on whatever api change
# happened to come next.
#
# The five below it are there for the same reason and are named one by one for
# the same reason: tests/unit/clientLimits.test.ts reads each out of the tree and
# checks the ceiling it hard-codes against the api constant that enforces it.
# `web/**` would buy identical coverage and spend four Postgres shards on every
# frontend change, which is most of the traffic on this repository. Keeping the
# list honest is not left to memory — that test fails when a file it reads is
# absent from here, which is the only state in which it would be decoration.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'cli/**'
      - 'preview-edge/**'
      - 'web/src/lib/tiptap.ts'
      - 'web/src/lib/titles.ts'
      - 'web/src/lib/search-query.ts'
      - 'web/src/lib/userSearch.svelte.ts'
      - 'web/src/lib/selection.svelte.ts'
      - 'web/src/lib/realtime.svelte.ts'
      - '.github/workflows/api-ci.yaml'
      - '.github/workflows/api-deploy.yaml'
  pull_request:
    paths:
      - 'api/**'
      - 'cli/**'
      - 'preview-edge/**'
      - 'web/src/lib/tiptap.ts'
      - 'web/src/lib/titles.ts'
      - 'web/src/lib/search-query.ts'
      - 'web/src/lib/userSearch.svelte.ts'
      - 'web/src/lib/selection.svelte.ts'
      - 'web/src/lib/realtime.svelte.ts'
      - '.github/workflows/api-ci.yaml'
      - '.github/workflows/api-deploy.yaml'

# `pnpm install` runs the PR's own prepare script, and the suite runs its tests.
# That is untrusted code, so it gets the narrowest token and no persisted
# credential to find in .git/config. The deploy workflows run main's tree and are
# a different case.
permissions:
  contents: 'read'

# Four test shards, two image builds and a checks job — the most expensive
# workflow here, and until now the one that kept running after it had been
# superseded.
#
# A literal group rather than '${{ github.workflow }}', for the reason
# api-deploy.yaml records: that expression expands to the `name:` field, which
# every workflow in this repository shares. Keyed on the ref so two pull
# requests cannot cancel each other — github.ref is refs/pull/<n>/merge on a
# pull request and refs/heads/main on a push, so the two never collide either.
# Cancelling is right here and wrong for the deploys: a killed shard leaves
# nothing behind, a killed deploy can leave a migration mid-flight.
concurrency:
  group: 'api-ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # The `paths:` filter above is the outer bound and stays exactly as wide as the
  # packages this workflow covers; narrowing it is how coverage disappears with
  # nothing to show for it. It is still much wider than what the jobs below read:
  # `api/k8s/**` and `api/docs/**` both sit inside it and no step here checks
  # anything about either, so a manifest edit used to run four Postgres+Redis
  # shards and two Docker builds. This job refines within the bound the filter
  # already set. It never widens it.
  #
  # The cost is one extra runner in front of everything — checkout plus the diff,
  # around 20s of added latency on every run — against four service containers
  # and two image builds skipped whenever a change is prose or infrastructure.
  #
  # Every job below is gated by an `if:` and so reports `skipped`, never
  # `success`, when it does not apply. Anything aggregating this workflow has to
  # treat `skipped` as fine and `failure`/`cancelled` as fatal, and has to have
  # `changes` itself among its `needs` — a `changes` that fails skips everything
  # downstream, which must not read as a clean run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api_code: ${{ steps.classify.outputs.api_code }}
      cli_code: ${{ steps.classify.outputs.cli_code }}
      preview_edge: ${{ steps.classify.outputs.preview_edge }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The diff needs both ends of its range in the local clone, and the
          # default depth-1 fetch has neither the pull request's base nor the
          # commit main sat on before the push. The whole history is 13MB.
          fetch-depth: 0
      - id: classify
        # Read through the environment rather than interpolated into the script:
        # `${{ }}` inside `run:` is textual substitution, and a ref that is not
        # what it looks like becomes shell.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Two events, two bases. A `pull_request` checkout is the merge commit,
          # so diffing from the base tip is exactly the pull request's own files.
          # A push to main carries `before`, the previous tip — which is the same
          # range GitHub evaluated the `paths:` filter over, so refining with it
          # cannot skip a file that filter reacted to.
          base=''
          if [ "$EVENT" = 'pull_request' ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi

          # Anything unresolvable — a branch's first push (`before` is all zeros),
          # a force push whose old tip is gone, a re-run after history moved —
          # means the range is unknown, and unknown has to mean changed. Failing
          # closed here is how main quietly stops being tested.
          everything=0
          changed=''
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base for $EVENT (base='$base') — treating every package as changed."
            everything=1
          else
            changed="$(git diff --name-only "$base" HEAD)"
            # shellcheck disable=SC2001 # the substitution is per-line, which
            # ${var//search/replace} cannot express.
            echo "$changed" | sed 's/^/  /'
          fi

          # An edited workflow re-verifies everything it runs: the classification
          # below describes these jobs, and a job that just changed is not
          # described by it any more.
          if [ "$everything" = 0 ] && printf '%s\n' "$changed" | grep -Eq '^\.github/workflows/'; then
            echo "A workflow file changed — treating every package as changed."
            everything=1
          fi

          # Subtractive, one provable entry at a time, because the safe direction
          # is to run too much: a path nobody has thought about yet falls through
          # to its package and costs a job, where an allowlist would drop it and
          # cost the coverage instead.
          #
          #   api/k8s/**        no step here reads a manifest. k8s-ci.yaml parses
          #                     them and api-deploy.yaml applies them; both carry
          #                     their own filter.
          #   api/docs/**       scaling.md, the bench harness's write-up. The
          #                     Dockerfile copies only package.json, the
          #                     lockfile, pnpm-workspace.yaml, scripts/ and
          #                     src/, so it is not build input either. The
          #                     product-wide feature research that used to sit
          #                     beside it is at `docs/feature-research.md` now,
          #                     outside `api/**` and so outside this workflow.
          #
          # The terraform entry that used to head this list is gone with the
          # directory: it lives at `infra/terraform/`, which `api/**` does not
          # match, so infra-ci.yaml is the whole of its CI and there is nothing
          # left here to subtract.
          #
          # api/README.md and api/CLAUDE.md are deliberately absent from that
          # list. tests/unit/documentedLimits.test.ts and
          # tests/unit/eventCatalog.test.ts read both files and assert the
          # numbers and the event table in them against the code, so an edit to
          # either really can fail the suite.
          #
          # web/src/lib/tiptap.ts is read the same way, by
          # tests/unit/documentEmptiness.test.ts, which is why `api_code` claims
          # it below: the `paths:` filter lets that one file in, and the shards
          # are the only thing that runs the test. The five that follow it are
          # read by tests/unit/clientLimits.test.ts and claimed for the same
          # reason. Every one of the six is listed in `paths:` above as well —
          # this pattern only decides which jobs run once a run has started, so a
          # file named in one place and not the other is covered by neither.
          inert='^api/(k8s|docs)/'
          relevant="$(printf '%s\n' "$changed" | grep -Ev "$inert" || true)"

          emit() {
            value=false
            if [ "$everything" = 1 ] || printf '%s\n' "$relevant" | grep -Eq "$2"; then
              value=true
            fi
            echo "$1=$value" | tee -a "$GITHUB_OUTPUT"
          }

          emit api_code '^api/|^web/src/lib/(tiptap|titles|search-query|userSearch\.svelte|selection\.svelte|realtime\.svelte)\.ts$'
          emit cli_code '^cli/'
          emit preview_edge '^preview-edge/'

  # Fast, DB-free checks. Runs in parallel with the test shards below, so a
  # lint or type error doesn't wait on the suite — and the suite doesn't wait
  # on them either.
  #
  # `cli_code` as well as `api_code`: api/tsconfig.json includes ../cli/**/* and
  # api/knip.json declares ../cli as a workspace, so a cli-only change is caught
  # here and nowhere else.
  checks:
    needs: changes
    if: needs.changes.outputs.api_code == 'true' || needs.changes.outputs.cli_code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          # No root package.json: the action reads `packageManager` from the
          # package it is setting pnpm up for. Left to its default it looks at
          # the repository root and fails with "No pnpm version is specified".
          package_json_file: api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          # Two lockfiles, neither of them web's: the resulting hash is what
          # keeps this cache entry distinct from web-ci's.
          cache-dependency-path: |
            api/pnpm-lock.yaml
            cli/pnpm-lock.yaml
      - run: pnpm -C api install --frozen-lockfile
      - run: pnpm -C cli install --frozen-lockfile
      - run: pnpm -C api run format:check
      - run: pnpm -C api run lint
      - run: pnpm -C api run type-check
      - run: pnpm -C api run knip
      # The api scripts cover api/src, api/tests, api/scripts and
      # api/vitest.config.ts. cli/ stays separate because its imports resolve
      # from cli/node_modules, and pnpm test runs the CLI suites through tsx,
      # which strips types without checking them. It gets its own install above
      # for the same reason it has its own lockfile.
      - run: pnpm -C cli run check

  # The suite runs with vitest fileParallelism:false: files within a run share
  # one database, so running them concurrently would collide. That leaves the
  # suite single-core and ~4 min — by far the slowest part of CI. Sharding
  # keeps the rule rather than breaking it: each shard gets its own isolated
  # Postgres + Redis, so files stay serial within a shard while the shards run
  # in parallel. Test files are independent (unique-id fixtures, per-file
  # afterAll cleanup, no shared seed), so any file split is safe.
  #
  # `cli_code` for the same reason as `checks`: api/vitest.config.ts includes
  # ../cli/tests/**, so these shards are the only thing that runs them.
  test:
    needs: changes
    if: needs.changes.outputs.api_code == 'true' || needs.changes.outputs.cli_code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_dev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Pinned to the tag production runs: PEXPIRE ... NX needs 7.0 or newer,
      # and a floating tag could also green-light semantics production lacks.
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          # No root package.json: the action reads `packageManager` from the
          # package it is setting pnpm up for. Left to its default it looks at
          # the repository root and fails with "No pnpm version is specified".
          package_json_file: api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            api/pnpm-lock.yaml
            cli/pnpm-lock.yaml
      - run: pnpm -C api install --frozen-lockfile
      # The suite includes the CLI tests, whose imports (commander,
      # openapi-fetch, mdast-*) resolve from cli/node_modules.
      - run: pnpm -C cli install --frozen-lockfile
      # Node's --env-file hard-errors when the file is missing, so write it.
      # It is read with a path relative to api/, which is where the suite runs.
      - name: Write .env.test
        run: |
          cat > api/.env.test <<'EOF'
          DB_HOSTNAME=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=game_dev_test
          STORAGE_DISK_ROOT=./data/test-uploads
          ENVIRONMENT=test
          REDIS_TEST_URL=redis://127.0.0.1:6379/15
          EOF
      # No `--` before the flag. npm swallows that separator; pnpm forwards it
      # into the script's argv, where vitest reads it as end-of-options and
      # ignores everything after — so `pnpm test -- --shard=1/4` silently runs
      # the whole suite in every shard and passes.
      #
      # working-directory rather than `-C api`, so the invocation pnpm's
      # argument forwarding is known to handle is byte-for-byte the one that
      # ran before the move. Everything else here uses `-C` because it has to
      # reach more than one package.
      - working-directory: api
        run: pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Nothing else reads this package: it is outside api/tsconfig.json's include,
  # outside api/knip.json, and no test imports it.
  preview-edge:
    needs: changes
    if: needs.changes.outputs.preview_edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          # No root package.json: the action reads `packageManager` from the
          # package it is setting pnpm up for. Left to its default it looks at
          # the repository root and fails with "No pnpm version is specified".
          package_json_file: preview-edge/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'preview-edge/pnpm-lock.yaml'
      - run: pnpm -C preview-edge install --frozen-lockfile
      - run: pnpm -C preview-edge run type-check
      # `node --test` over the .ts file directly — node 22.18+ strips the types,
      # so the package needs no test runner and no dependency for this. It
      # covers auth.ts, the fail-closed preview gate, which is the one piece
      # here whose failure mode is silent.
      - run: pnpm -C preview-edge run test

  # The Dockerfiles are otherwise unverified until a merge to main triggers a
  # production build and push. Build both here, without pushing, so a broken
  # image fails on the pull request instead. Each context is the package
  # directory, which is also what makes docker read that package's
  # .dockerignore.
  #
  # The job runs if either image can have moved; each build is then gated on its
  # own package, so a change to one of them does not re-enter the other. A
  # cli-only change reaches neither build context and skips the job outright.
  images:
    needs: changes
    if: needs.changes.outputs.api_code == 'true' || needs.changes.outputs.preview_edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # Distinct cache scopes. The gha exporter defaults both to `buildkit`, so one
      # image's export overwrites the other's on every run and neither ever hits.
      - name: 'Build API image'
        if: needs.changes.outputs.api_code == 'true'
        uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          cache-from: 'type=gha,scope=api'
          cache-to: 'type=gha,mode=max,scope=api'
      - name: 'Build preview-edge image'
        if: needs.changes.outputs.preview_edge == 'true'
        uses: docker/build-push-action@v7
        with:
          context: preview-edge
          push: false
          cache-from: 'type=gha,scope=preview-edge'
          cache-to: 'type=gha,mode=max,scope=preview-edge'
