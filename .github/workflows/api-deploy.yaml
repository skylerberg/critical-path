name: api-production-deploy
run-name: API Production Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/src/**'
      - 'api/scripts/**'
      - 'api/package.json'
      - 'api/pnpm-lock.yaml'
      - 'api/pnpm-workspace.yaml'
      - 'api/Dockerfile'
      - 'api/k8s/**'
      - '.github/workflows/api-deploy.yaml'
# No cancel-in-progress: a killed run could leave a migration mid-flight.
#
# The group is a literal rather than '${{ github.workflow }}'. That expression
# expands to the `name:` above, and the web deploy — which does cancel in
# progress — used to carry the same name, so the two shared one group and a web
# deploy could cancel an api deploy mid-migration.
concurrency:
  group: 'api-production-deploy'
jobs:
  deploy-to-production:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      IMAGE: us-west1-docker.pkg.dev/realm-construction/critical-path/api

    steps:
      - uses: actions/checkout@v7

      - id: 'auth'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/1085332810847/locations/global/workloadIdentityPools/default-pool/providers/github-provider'
          service_account: 'github-actions-service@realm-construction.iam.gserviceaccount.com'
          token_format: 'access_token'

      - uses: 'google-github-actions/setup-gcloud@v3'
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: 'cow-cluster'
          location: 'us-west1-a'

      - uses: 'docker/login-action@v4'
        with:
          registry: 'us-west1-docker.pkg.dev'
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - uses: 'docker/setup-buildx-action@v4'

      # Context is api/, not the repo root: every COPY in api/Dockerfile is
      # context-relative and names something inside api/, and this is also what
      # makes docker read api/.dockerignore.
      #
      # scope=api, the same scope api-ci's images job uses. Two things ride on
      # that. Without any scope the gha exporter defaults to `buildkit`, which
      # preview-edge.yaml was also writing to, so the two evicted each other on
      # every run and neither ever hit. And sharing the scope with CI rather than
      # taking a private one is deliberate: both build the same context from the
      # same Dockerfile on the same runner image, and the deploy on main can then
      # start from what main's own api-ci wrote. That directly narrows the window
      # the two-commit deploy rule exists for — web is live ~45s after a push and
      # api 2-3 minutes after, and every second off this build is a second less
      # of it.
      - name: 'Build and push image'
        uses: 'docker/build-push-action@v7'
        with:
          context: api
          push: true
          tags: '${{ env.IMAGE }}:${{ github.sha }}'
          cache-from: 'type=gha,scope=api'
          cache-to: 'type=gha,mode=max,scope=api'

      - name: 'Apply base manifests'
        working-directory: api
        run: kubectl apply -f k8s/namespace.yaml -f k8s/serviceaccount.yaml -f k8s/redis.yaml -f k8s/pdb.yaml -f k8s/service.yaml

      - name: 'Run database migrations'
        working-directory: api
        run: |
          kubectl -n critical-path delete job "critical-path-migrate-$GITHUB_SHA" --ignore-not-found
          sed "s/{COMMITHASH}/$GITHUB_SHA/g" k8s/migrate-job.yaml | kubectl apply -f -
          # Conditions come as a list ("SuccessCriteriaMet Complete",
          # "FailureTarget Failed" on k8s >= 1.31), so substring-match.
          for _ in $(seq 1 60); do
            conditions=$(kubectl -n critical-path get job "critical-path-migrate-$GITHUB_SHA" \
              -o jsonpath='{.status.conditions[?(@.status=="True")].type}')
            case " $conditions " in
              *' Complete '*)
                exit 0
                ;;
              *' Failed '*)
                echo "Migration job failed; logs:" >&2
                kubectl -n critical-path logs "job/critical-path-migrate-$GITHUB_SHA" >&2 || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for migration job; logs:" >&2
          kubectl -n critical-path logs "job/critical-path-migrate-$GITHUB_SHA" >&2 || true
          exit 1

      - name: 'Deploy'
        working-directory: api
        run: |
          sed "s/{COMMITHASH}/$GITHUB_SHA/g" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n critical-path rollout status deployment/critical-path-api --timeout=300s
