name: preview-edge-deploy

# Builds and rolls out the Cloud Run preview edge (serves pr-<n>.… static
# builds). The service itself is created and configured by terraform; this
# workflow only publishes the image and points the service at the new revision.
on:
  push:
    branches: [main]
    paths:
      - 'preview-edge/**'
      - '.github/workflows/preview-edge.yaml'
  workflow_dispatch:

# A literal group, like the two production deploys: '${{ github.workflow }}'
# expands to the `name:` field, which every workflow in this repository shares.
concurrency:
  group: 'preview-edge-deploy'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      IMAGE: us-west1-docker.pkg.dev/realm-construction/critical-path/preview-edge
      SERVICE: critical-path-preview-edge
      REGION: us-west1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          # No root package.json: the action reads `packageManager` from the
          # package it is setting pnpm up for. Left to its default it looks at
          # the repository root and fails with "No pnpm version is specified".
          package_json_file: preview-edge/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'preview-edge/pnpm-lock.yaml'

      - run: pnpm -C preview-edge install --frozen-lockfile

      - id: 'auth'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: 'projects/1085332810847/locations/global/workloadIdentityPools/default-pool/providers/github-provider'
          service_account: 'github-actions-service@realm-construction.iam.gserviceaccount.com'
          token_format: 'access_token'

      - uses: 'google-github-actions/setup-gcloud@v3'

      - uses: 'docker/login-action@v4'
        with:
          registry: 'us-west1-docker.pkg.dev'
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - uses: 'docker/setup-buildx-action@v4'

      - name: 'Type-check'
        run: pnpm -C preview-edge run type-check

      # API CI already ran this on the pull request; repeated here because this
      # workflow also fires on workflow_dispatch, and the gate it covers is the
      # only thing standing in front of the production data a preview reaches.
      - name: 'Test'
        run: pnpm -C preview-edge run test

      - name: 'Build and push image'
        uses: 'docker/build-push-action@v7'
        with:
          context: preview-edge
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # scope=preview-edge, matching api-ci's build of this same context.
          # Unscoped, the gha exporter defaults to `buildkit` — which api-deploy
          # was also writing to, so each run evicted the other's export and
          # neither image ever hit its cache.
          cache-from: 'type=gha,scope=preview-edge'
          cache-to: 'type=gha,mode=max,scope=preview-edge'

      # Image-only update: terraform owns the service config (env, service
      # account, ingress), so we never set those here. On the very first run,
      # before `terraform apply` has created the service, this is a no-op and
      # the :latest tag is already published for terraform to bootstrap from.
      - name: 'Roll out to Cloud Run'
        run: |
          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            gcloud run services update "$SERVICE" \
              --image "$IMAGE:$GITHUB_SHA" \
              --region "$REGION"
          else
            echo "Service $SERVICE not found — run terraform apply first (it creates the service). The :latest image is published for bootstrap."
          fi
