name: preview-build

# Unprivileged half of per-PR previews. Builds the PR (VITE_PREVIEW disables
# the PWA) and uploads the bundle as an artifact. It never touches secrets or
# the deploy SA — the privileged upload happens in web-preview-deploy.yaml,
# which is triggered by this run via `workflow_run` and therefore runs on
# `main`'s workflow file (so a PR can't rewrite the privileged steps).
#
# Deliberately unfiltered: an api-only PR still gets a preview of main's web
# bundle, and the preview comment says which API it is talking to.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: 'read'

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # No root package.json: the action reads `packageManager` from the
          # package it is setting pnpm up for. Left to its default it looks at
          # the repository root and fails with "No pnpm version is specified".
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 'Build (or mark closed)'
        run: |
          mkdir -p out
          if [ "${{ github.event.action }}" = "closed" ]; then
            printf 'closed' > out/mode
          else
            pnpm install --frozen-lockfile
            VITE_PREVIEW=1 pnpm run build
            printf 'deploy' > out/mode
            mv dist out/dist
          fi

      # An action input, so the job's working-directory does not apply. The
      # artifact's own root is still web/out's contents (`mode`, `dist/`), which
      # is what web-preview-deploy.yaml downloads into `out/`.
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: web/out
          retention-days: 1
