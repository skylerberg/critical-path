name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, DB-free checks. Runs in parallel with the test shards below, so a
  # lint or type error doesn't wait on the suite — and the suite doesn't wait
  # on them either.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix cli
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run knip
      # The root scripts cover src/, tests/, scripts/ and vitest.config.ts.
      # cli/ stays separate because its imports resolve from cli/node_modules,
      # and npm test runs the CLI suites through tsx, which strips types
      # without checking them.
      - run: npm run --prefix cli check

  # The suite runs with vitest fileParallelism:false: files within a run share
  # one database, so running them concurrently would collide. That leaves the
  # suite single-core and ~4 min — by far the slowest part of CI. Sharding
  # keeps the rule rather than breaking it: each shard gets its own isolated
  # Postgres + Redis, so files stay serial within a shard while the shards run
  # in parallel. Test files are independent (unique-id fixtures, per-file
  # afterAll cleanup, no shared seed), so any file split is safe.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_dev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Pinned to the tag production runs: PEXPIRE ... NX needs 7.0 or newer,
      # and a floating tag could also green-light semantics production lacks.
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # The suite includes cli/tests/**, whose imports (commander,
      # openapi-fetch, mdast-*) resolve from cli/node_modules.
      - run: npm ci --prefix cli
      # Node's --env-file hard-errors when the file is missing, so write it.
      - name: Write .env.test
        run: |
          cat > .env.test <<'EOF'
          DB_HOSTNAME=127.0.0.1
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=game_dev_test
          STORAGE_DISK_ROOT=./data/test-uploads
          ENVIRONMENT=test
          REDIS_TEST_URL=redis://127.0.0.1:6379/15
          EOF
      - run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  preview-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'preview-edge/package-lock.json'
      - run: npm ci --prefix preview-edge
      - run: npm --prefix preview-edge run type-check
